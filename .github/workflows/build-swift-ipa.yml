name: Build SkillSync iOS Simulator

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/build-swift-ipa.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/build-swift-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-swift-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Compile for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS Simulator runtime if missing
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] "." v[2] }')"
          echo "IOS_SIMULATOR_RUNTIME_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"

          runtime_available() {
            xcrun simctl list runtimes -j |
              python3 -c '
          import json
          import sys

          target = sys.argv[1]
          data = json.load(sys.stdin)
          available = any(
              runtime.get("platform") == "iOS"
              and runtime.get("isAvailable")
              and runtime.get("version") == target
              for runtime in data.get("runtimes", [])
          )
          sys.exit(0 if available else 1)
          ' "$1"
          }

          if ! runtime_available "$XCODE_VERSION"; then
            echo "Installing iOS $XCODE_VERSION Simulator runtime to match the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi

          if ! runtime_available "$XCODE_VERSION"; then
            echo "No iOS $XCODE_VERSION Simulator runtime is available for the selected Xcode." >&2
            exit 1
          fi

          xcrun simctl list runtimes

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project "$GITHUB_WORKSPACE/ios-native/SkillSyncAI.xcodeproj"
          -scheme SkillSyncAI

      - name: Clean and build for an available iPad simulator
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the requested iPad model from the runtime matching Xcode,
          # then use another iPad from that runtime or the generic destination.
          SIMULATOR_DESTINATION="$(
            xcrun simctl list devices available -j |
              python3 -c '
          import json
          import sys

          version = sys.argv[1].replace(".", "-")
          runtime_id = "com.apple.CoreSimulator.SimRuntime.iOS-" + version
          data = json.load(sys.stdin)
          devices = data["devices"].get(runtime_id, [])
          ipads = [device for device in devices if device.get("isAvailable") and device["name"].startswith("iPad ")]
          preferred = next((device for device in ipads if device["name"] == "iPad (10th generation)"), None)
          selected = preferred or (ipads[0] if ipads else None)
          if selected:
              print("platform=iOS Simulator,id=" + selected["udid"])
          else:
              print("generic/platform=iOS Simulator")
          ' "$IOS_SIMULATOR_RUNTIME_VERSION"
          )"

          echo "Building for destination: $SIMULATOR_DESTINATION"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/ios-native/SkillSyncAI.xcodeproj" \
            -scheme SkillSyncAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/SkillSyncAI-DerivedData" \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
