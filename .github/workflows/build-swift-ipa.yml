name: Build SkillSync iOS Simulator

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/build-swift-ipa.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/build-swift-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-swift-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Analyze and compile for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-native
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project SkillSyncAI.xcodeproj -scheme SkillSyncAI

      - name: Run Xcode static analyzer
        run: >-
          xcodebuild analyze
          -project SkillSyncAI.xcodeproj
          -scheme SkillSyncAI
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Build iOS Simulator app
        run: >-
          xcodebuild build
          -project SkillSyncAI.xcodeproj
          -scheme SkillSyncAI
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/SkillSyncAI-DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
