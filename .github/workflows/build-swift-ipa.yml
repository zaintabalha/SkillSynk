name: Build SkillSync iOS unsigned IPA

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/build-swift-ipa.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/build-swift-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-swift-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Archive and package unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project "$GITHUB_WORKSPACE/ios-native/SkillSyncAI.xcodeproj"
          -scheme SkillSyncAI

      - name: Archive for generic iOS device without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$GITHUB_WORKSPACE/ios-native/SkillSyncAI.xcodeproj" \
            -scheme SkillSyncAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SkillSyncAI.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/SkillSyncAI-DeviceDerivedData" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/SkillSyncAI.xcarchive/Products/Applications/SkillSyncAI.app"
          payload_dir="$RUNNER_TEMP/SkillSyncAI-ipa/Payload"
          ipa_path="$RUNNER_TEMP/SkillSyncAI.ipa"

          if [[ ! -d "$app_path" ]]; then
            echo "Archived app not found at $app_path" >&2
            exit 1
          fi

          mkdir -p "$payload_dir"
          ditto "$app_path" "$payload_dir/SkillSyncAI.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/SkillSyncAI-ipa/Payload" \
            "$ipa_path"

          python3 - "$ipa_path" <<'PY'
          import sys
          import zipfile

          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              if not any(name.startswith("Payload/SkillSyncAI.app/Info.plist") for name in names):
                  raise SystemExit("IPA archive is missing Payload/SkillSyncAI.app/Info.plist")
          print(f"Verified unsigned IPA: {ipa}")
          PY

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillSyncAI-ipa
          path: ${{ runner.temp }}/SkillSyncAI.ipa
          if-no-files-found: error
          retention-days: 14
