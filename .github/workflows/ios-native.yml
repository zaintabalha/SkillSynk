name: Native iOS build

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Ensure matching iOS Simulator runtime is installed
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] "." v[2] }')"
          runtime_available() {
            xcrun simctl list runtimes -j |
              python3 -c '
          import json
          import sys

          target = sys.argv[1]
          data = json.load(sys.stdin)
          available = any(
              runtime.get("platform") == "iOS"
              and runtime.get("isAvailable")
              and runtime.get("version") == target
              for runtime in data.get("runtimes", [])
          )
          sys.exit(0 if available else 1)
          ' "$1"
          }
          if ! runtime_available "$XCODE_VERSION"; then
            xcodebuild -downloadPlatform iOS
          fi
          if ! runtime_available "$XCODE_VERSION"; then
            echo "No iOS $XCODE_VERSION Simulator runtime is available for the selected Xcode." >&2
            exit 1
          fi

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project "$GITHUB_WORKSPACE/ios-native/SkillSyncAI.xcodeproj"
          -scheme SkillSyncAI

      - name: Run Xcode static analyzer
        run: >-
          xcodebuild analyze
          -project ios-native/SkillSyncAI.xcodeproj
          -scheme SkillSyncAI
          -configuration Debug
          -destination 'generic/platform=iOS Simulator,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=YES

      - name: Build iOS Simulator app
        run: >-
          xcodebuild build
          -project ios-native/SkillSyncAI.xcodeproj
          -scheme SkillSyncAI
          -configuration Debug
          -destination 'generic/platform=iOS Simulator,arch=arm64'
          -derivedDataPath build/ios-native
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=YES
