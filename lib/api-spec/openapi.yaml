openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: skillsync
    description: SkillSync AI platform operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /skillsync/dashboard:
    get:
      operationId: getSkillSyncDashboard
      tags: [skillsync]
      summary: Get the signed-in user's dashboard
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /skillsync/profile:
    get:
      operationId: getSkillSyncProfile
      tags: [skillsync]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: User profile, or null when onboarding is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
    put:
      operationId: saveSkillSyncProfile
      tags: [skillsync]
      summary: Create or update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /skillsync/matches:
    get:
      operationId: getSkillSyncMatches
      tags: [skillsync]
      summary: Get compatible students for the signed-in user
      responses:
        "200":
          description: Compatible student profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchCandidate"
  /skillsync/matches/recommendations:
    post:
      operationId: generateSkillSyncRecommendations
      tags: [skillsync]
      summary: Generate AI-powered complementary skill recommendations
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "200":
          description: Match recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
  /skillsync/matches/connect:
    post:
      operationId: connectSkillSyncMatch
      tags: [skillsync]
      summary: Connect to a student and create a shared learning room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectInput"
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "201":
          description: Created learning room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
  /skillsync/push/devices:
    post:
      operationId: registerSkillSyncPushDevice
      tags: [skillsync]
      summary: Register the signed-in iOS device for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "204":
          description: Device registered
        "400":
          description: Invalid device registration
    delete:
      operationId: unregisterSkillSyncPushDevice
      tags: [skillsync]
      summary: Remove the signed-in iOS device from push delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "204":
          description: Device removed
  /skillsync/rooms:
    get:
      operationId: getSkillSyncRooms
      tags: [skillsync]
      summary: List the signed-in user's learning rooms
      responses:
        "200":
          description: Learning rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomSummary"
  /skillsync/rooms/{roomId}:
    get:
      operationId: getSkillSyncRoom
      tags: [skillsync]
      summary: Get a learning room, curriculum, messages, and submissions
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Learning room detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRoom"
  /skillsync/rooms/{roomId}/messages:
    post:
      operationId: sendSkillSyncMessage
      tags: [skillsync]
      summary: Send a chat message and receive moderator guidance
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "201":
          description: Saved partner message and optional explicitly requested SkillSync AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSendResult"
  /skillsync/rooms/{roomId}/ai-messages:
    post:
      operationId: sendSkillSyncAiMessage
      tags: [skillsync]
      summary: Send a prompt to the shared SkillSync AI workspace
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "201":
          description: Shared AI response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSendResult" }
  /skillsync/rooms/{roomId}/media/upload-url:
    post:
      operationId: requestSkillSyncRoomMediaUpload
      tags: [skillsync]
      summary: Create a short-lived upload URL for a room image or voice note
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomMediaUploadInput" }
      responses:
        "200":
          description: Short-lived private object upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomMediaUploadUrl" }
        "400":
          description: Invalid file metadata
        "403":
          description: Room is in demo mode or user lacks access
  /skillsync/rooms/{roomId}/media/{mediaId}:
    get:
      operationId: getSkillSyncRoomMedia
      tags: [skillsync]
      summary: Stream a private room attachment to an authorized participant
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Image or audio content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Attachment not found in this room
    delete:
      operationId: deletePendingSkillSyncRoomMedia
      tags: [skillsync]
      summary: Remove an uploaded attachment that has not been sent
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Pending attachment removed
        "404":
          description: Pending attachment not found
  /skillsync/rooms/{roomId}/messages/{messageId}/transcription:
    post:
      operationId: transcribeSkillSyncVoiceNote
      tags: [skillsync]
      summary: Transcribe a sent voice note on request
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transcript for the voice note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceNoteTranscriptResponse" }
        "404":
          description: Voice note not found in this room
        "429":
          $ref: "#/components/responses/AiLimited"
  /skillsync/rooms/{roomId}/call-copilot:
    post:
      operationId: requestSkillSyncCallCopilot
      tags: [skillsync]
      summary: Run a transcript-based SkillSync AI call co-pilot action
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallCopilotInput" }
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "200":
          description: Speaking prompt, live hint, activity, or saved call-summary card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallCopilotResult" }
  /skillsync/rooms/{roomId}/call-transcription:
    post:
      operationId: transcribeSkillSyncCallAudio
      tags: [skillsync]
      summary: Transcribe a short, consented call-audio chunk
      description: Set the Accept-Language request header to en or ar.
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Transcribed text; silence may produce an empty string
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string, maxLength: 10000 }
        "400":
          description: Invalid audio chunk or room
        "413":
          description: Audio chunk is too large
        "429":
          $ref: "#/components/responses/AiLimited"
        "415":
          description: Unsupported audio format
  /skillsync/rooms/{roomId}/activities:
    get:
      operationId: listSkillSyncActivities
      tags: [skillsync]
      summary: List shared quizzes, flashcards, and simulators
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shared room activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SharedActivity" }
    post:
      operationId: generateSkillSyncActivity
      tags: [skillsync]
      summary: Generate a shared learning activity from room context
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityGenerationInput" }
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "201":
          description: Generated shared activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedActivity" }
  /skillsync/rooms/{roomId}/activities/{activityId}/solution:
    post:
      operationId: generateSkillSyncSimulatorSolution
      tags: [skillsync]
      summary: Generate a code solution for a shared coding simulator
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "400":
          description: The activity is not a coding simulator
        "404":
          description: Room or activity not found
        "429":
          $ref: "#/components/responses/AiLimited"
        "200":
          description: Generated JavaScript solution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorSolution" }
  /skillsync/rooms/{roomId}/activities/{activityId}/attempts:
    post:
      operationId: submitSkillSyncActivityAttempt
      tags: [skillsync]
      summary: Submit a shared activity attempt
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityAttemptInput" }
      responses:
        "201":
          description: Saved activity attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAttempt" }
  /skillsync/rooms/{roomId}/daily-challenge:
    post:
      operationId: generateSkillSyncDailyChallenge
      tags: [skillsync]
      summary: Generate the room's next daily challenge
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyChallenge"
        "429":
          $ref: "#/components/responses/AiLimited"
  /skillsync/rooms/{roomId}/submissions:
    post:
      operationId: submitSkillSyncProject
      tags: [skillsync]
      summary: Submit a joint project for AI evaluation
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "429":
          $ref: "#/components/responses/AiLimited"
        "201":
          description: Project evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSubmission"
  /skillsync/reports:
    post:
      operationId: submitSkillSyncReport
      tags: [skillsync]
      summary: Submit a partner or technical complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTicket"
  /skillsync/notices:
    get:
      operationId: getSkillSyncNotices
      tags: [skillsync]
      summary: Get unread account notices
      responses:
        "200":
          description: Unread notices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserNotice" }
  /skillsync/notices/{noticeId}/read:
    post:
      operationId: markSkillSyncNoticeRead
      tags: [skillsync]
      summary: Mark an account notice as read
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Notice marked read
  /skillsync/admin/access:
    get:
      operationId: getSkillSyncAdminAccess
      tags: [skillsync]
      summary: Check whether the signed-in user is an administrator
      responses:
        "200":
          description: Admin access status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /skillsync/admin/overview:
    get:
      operationId: getSkillSyncAdminOverview
      tags: [skillsync]
      summary: Get platform analytics for administrators
      responses:
        "200":
          description: Platform analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /skillsync/admin/reports:
    get:
      operationId: listSkillSyncAdminReports
      tags: [skillsync]
      summary: List and filter complaints
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, under_review, resolved]
      responses:
        "200":
          description: Complaints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportTicket" }
  /skillsync/admin/reports/{reportId}:
    get:
      operationId: getSkillSyncAdminReport
      tags: [skillsync]
      summary: Inspect a complaint and its room transcript
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Complaint detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportDetail" }
    patch:
      operationId: updateSkillSyncAdminReport
      tags: [skillsync]
      summary: Update complaint status and admin notes
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUpdateInput" }
      responses:
        "200":
          description: Updated complaint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTicket" }
  /skillsync/admin/users:
    get:
      operationId: listSkillSyncAdminUsers
      tags: [skillsync]
      summary: List student profiles and account status
      responses:
        "200":
          description: Student profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
  /skillsync/admin/rooms:
    get:
      operationId: listSkillSyncAdminRooms
      tags: [skillsync]
      summary: List all co-learning rooms
      responses:
        "200":
          description: Learning rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminRoom" }
  /skillsync/admin/users/{userId}/warning:
    post:
      operationId: warnSkillSyncAdminUser
      tags: [skillsync]
      summary: Send a documented warning to a student
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarningInput" }
      responses:
        "201":
          description: Warning notice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAction" }
  /skillsync/admin/users/{userId}/suspension:
    put:
      operationId: suspendSkillSyncAdminUser
      tags: [skillsync]
      summary: Suspend a student account
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspensionInput" }
      responses:
        "200":
          description: Suspension recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAction" }
    delete:
      operationId: unsuspendSkillSyncAdminUser
      tags: [skillsync]
      summary: Restore a suspended account
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Suspension removed
  /skillsync/admin/rooms/{roomId}/unmatch:
    post:
      operationId: unmatchSkillSyncAdminRoom
      tags: [skillsync]
      summary: Unmatch a pair and preserve its transcript
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pair unmatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAction" }
  /skillsync/admin/rooms/{roomId}/regenerate-curriculum:
    post:
      operationId: regenerateSkillSyncAdminCurriculum
      tags: [skillsync]
      summary: Regenerate a room's curriculum
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New curriculum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumRegeneration" }
        "429":
          $ref: "#/components/responses/AiLimited"
components:
  responses:
    AiLimited:
      description: AI rate or concurrency limit reached. Ordinary partner chat remains available.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiLimitResponse"
  schemas:
    AiLimitResponse:
      type: object
      required: [error, code, retryAfterSeconds]
      properties:
        error:
          type: string
          description: Retry guidance in English and Arabic.
        code: { type: string, enum: [AI_LIMIT_EXCEEDED] }
        retryAfterSeconds: { type: integer, minimum: 1 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/UserProfile"
            - type: "null"
    UserProfile:
      type: object
      required: [userId, displayName, university, teachSkill, learnSkill, bio, createdAt, updatedAt]
      properties:
        userId: { type: string }
        displayName: { type: string }
        university: { type: string }
        teachSkill: { type: string }
        learnSkill: { type: string }
        bio: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProfileInput:
      type: object
      required: [displayName, university, teachSkill, learnSkill, bio]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        university: { type: string, minLength: 1, maxLength: 120 }
        teachSkill: { type: string, minLength: 1, maxLength: 80 }
        learnSkill: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: string, maxLength: 500 }
    MatchCandidate:
      type: object
      required: [userId, displayName, university, teachSkill, learnSkill, bio, compatibilityScore, whyMatch]
      properties:
        userId: { type: string }
        displayName: { type: string }
        university: { type: string }
        teachSkill: { type: string }
        learnSkill: { type: string }
        bio: { type: string }
        compatibilityScore: { type: integer, minimum: 0, maximum: 100 }
        whyMatch: { type: string }
    RecommendationResponse:
      type: object
      required: [recommendations, aiPowered]
      properties:
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/MatchCandidate" }
        aiPowered: { type: boolean }
    ConnectInput:
      type: object
      required: [partnerUserId]
      properties:
        partnerUserId: { type: string }
    RoomSummary:
      type: object
      required: [roomId, partnerUserId, partnerName, projectTitle, status, progress, lastMessage, isDemo, updatedAt]
      properties:
        roomId: { type: string }
        partnerUserId: { type: string }
        partnerName: { type: string }
        projectTitle: { type: string }
        status: { type: string, enum: [active, completed, unmatched] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        lastMessage: { type: ["string", "null"] }
        isDemo: { type: boolean }
        updatedAt: { type: string, format: date-time }
    Curriculum:
      type: object
      required: [title, description, goal, stages]
      properties:
        title: { type: string }
        description: { type: string }
        goal: { type: string }
        stages:
          type: array
          items: { type: string }
        learningPaths:
          type: object
          required: [userA, userB]
          properties:
            userA: { $ref: "#/components/schemas/PersonalLearningPath" }
            userB: { $ref: "#/components/schemas/PersonalLearningPath" }
        aiPowered: { type: boolean }
        generationStatus: { type: string, enum: [pending, ready] }
    PersonalLearningPath:
      type: object
      required: [title, goal, stages]
      properties:
        title: { type: string }
        goal: { type: string }
        stages:
          type: array
          items: { type: string }
    ChatMessage:
      type: object
      required: [id, roomId, senderId, senderName, senderType, channel, replyToMessageId, replyTo, activityId, content, mediaType, mediaUrl, mediaName, mediaSize, mediaDurationSeconds, transcript, createdAt]
      properties:
        id: { type: string }
        roomId: { type: string }
        senderId: { type: ["string", "null"] }
        senderName: { type: string }
        senderType: { type: string, enum: [student, assistant, moderator] }
        channel: { type: string, enum: [partner, ai] }
        replyToMessageId: { type: ["string", "null"] }
        replyTo:
          oneOf:
            - $ref: "#/components/schemas/MessageReplySnapshot"
            - type: "null"
        activityId: { type: ["string", "null"] }
        content: { type: string }
        mediaType: { type: ["string", "null"], enum: [image, audio, null] }
        mediaUrl: { type: ["string", "null"] }
        mediaName: { type: ["string", "null"] }
        mediaSize: { type: ["integer", "null"], minimum: 0 }
        mediaDurationSeconds: { type: ["integer", "null"], minimum: 0 }
        transcript: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
